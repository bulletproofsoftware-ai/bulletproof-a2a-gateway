# A2A Gateway — Agent Capabilities Registry
#
# THIS IS AN EXAMPLE. Replace these entries with your own agents.
#
# This file is the explicit allowlist: an agent that is not listed here is not
# reachable through the gateway. The gateway loads it at startup, so edit the
# file and restart the process to change what is exposed.
#
# Point the gateway at a different file with A2A_REGISTRY_PATH, e.g.
#   A2A_REGISTRY_PATH=/etc/a2a/my-agents.yaml
#
# Entry fields
# ------------
#   agent_id             Required. The identifier callers use, and the value
#                        substituted into {agent_id} in A2A_INVOKER_TEMPLATE.
#   description          Required. Shown in /api/v1/agents, the A2A agent card,
#                        and as the MCP tool description.
#   externally_callable  Default true. Set false to keep an entry in the file
#                        but hidden from every external surface.
#   trust_level          "standard" (any valid API key) or "elevated"
#                        (additionally requires the X-Trust-Level: elevated
#                        header). Use elevated for anything that writes.
#   allowed_tools        Advisory list published in discovery responses. The
#                        gateway does not enforce it — your agent runtime does.
#   max_tokens           Advisory ceiling published in discovery responses.
#
# See docs/ADMINISTRATOR.md for the full schema and examples/ for a larger,
# real-world registry.

version: "1.0.0"
gateway_port: 8100

agents:
  - agent_id: example-reviewer
    description: Reviews a supplied diff or file for correctness, style, and obvious defects. Read-only.
    externally_callable: true
    trust_level: standard
    allowed_tools: [Read, Glob, Grep]
    max_tokens: 16384

  - agent_id: example-researcher
    description: Researches a technical question and returns a summary with sources. Read-only.
    externally_callable: true
    trust_level: standard
    allowed_tools: [Read, Glob, Grep]
    max_tokens: 32768

  - agent_id: example-builder
    description: Implements changes from a specification. Writes files, so it is gated behind elevated trust.
    externally_callable: true
    trust_level: elevated
    allowed_tools: [Read, Write, Edit, Glob, Grep]
    max_tokens: 32768
